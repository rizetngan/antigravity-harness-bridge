<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="670" viewBox="0 0 1500 670" role="img" aria-labelledby="t d">
<title id="t">Two ways to connect an Agent Harness client to Antigravity</title><desc id="d">ACP-native clients connect directly to agy acp. Non-ACP clients or clients needing native model picker integration use a host-specific adapter and the future Bridge Core.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#171e34"/></linearGradient><linearGradient id="g" x2="1" y2="1"><stop stop-color="#f1c879"/><stop offset="1" stop-color="#b77f37"/></linearGradient><linearGradient id="c" x2="1" y2="1"><stop stop-color="#57d6e7"/><stop offset="1" stop-color="#278fac"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9eadd0"/></marker><style>.h{font:700 24px Inter,Arial,sans-serif;fill:#f4f6ff}.sub{font:500 16px Inter,Arial,sans-serif;fill:#adb9d5}.tag{font:700 12px Inter,Arial,sans-serif;letter-spacing:1.4px;fill:#d4dcf3}.box{fill:#18213a;stroke:#405078;stroke-width:1.5}.pill{fill:#222e4c;stroke:#435780}.line{stroke:#9eadd0;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1500" height="670" rx="28" fill="url(#bg)"/><text x="70" y="70" class="tag">CHOOSE THE RIGHT CONNECTION</text><text x="70" y="112" class="h" font-size="32">Do not build an adapter if ACP already does the job.</text>
<rect x="70" y="175" width="650" height="390" rx="24" class="box"/><rect x="70" y="175" width="650" height="8" rx="4" fill="url(#g)"/><text x="110" y="225" class="tag">PATH A · DIRECT ACP</text><text x="110" y="270" class="h">ACP-native client</text><rect x="110" y="315" width="225" height="100" rx="16" class="pill"/><text x="135" y="355" class="h" font-size="18">Editor / Harness</text><text x="135" y="385" class="sub">Zed · JetBrains · Xcode</text><path d="M335 365H430" class="line"/><rect x="435" y="315" width="235" height="100" rx="16" class="pill"/><text x="460" y="355" class="h" font-size="18">agy acp</text><text x="460" y="385" class="sub">Official ACP v1 server</text><text x="110" y="475" class="sub">Best when the host already supports ACP.</text><text x="110" y="510" class="sub">No Bridge proxy or custom host plugin required.</text>
<rect x="780" y="175" width="650" height="390" rx="24" class="box"/><rect x="780" y="175" width="650" height="8" rx="4" fill="url(#c)"/><text x="820" y="225" class="tag">PATH B · NATIVE ADAPTER</text><text x="820" y="270" class="h">Non-ACP or deeper integration</text><rect x="820" y="315" width="170" height="100" rx="16" class="pill"/><text x="845" y="355" class="h" font-size="18">Host</text><text x="845" y="385" class="sub">Native UI / API</text><path d="M990 365H1050" class="line"/><rect x="1055" y="315" width="160" height="100" rx="16" class="pill"/><text x="1077" y="355" class="h" font-size="18">Adapter</text><text x="1077" y="385" class="sub">Host mapping</text><path d="M1215 365H1270" class="line"/><rect x="1275" y="315" width="115" height="100" rx="16" class="pill"/><text x="1292" y="355" class="h" font-size="17">Core</text><text x="1292" y="385" class="sub">ACP</text><text x="820" y="475" class="sub">Use when native model picker, host transcript, or custom events matter.</text><text x="820" y="510" class="sub">Requires a tested adapter for that specific host.</text><text x="70" y="620" class="tag">CURSOR IS THE FIRST PATH-B ADAPTER · V1.1.2 VERIFIED</text></svg>
