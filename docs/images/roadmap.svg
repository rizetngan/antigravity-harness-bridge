<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="550" viewBox="0 0 1500 550" role="img" aria-labelledby="t d">
<title id="t">Antigravity Agent Bridge roadmap</title><desc id="d">Five stages: stabilize Cursor adapter, extract shared core, streamline ACP clients, add native adapters selectively, then publish adapter SDK and cross-platform support.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#171e34"/></linearGradient><linearGradient id="done" x2="1" y2="1"><stop stop-color="#8c80ff"/><stop offset="1" stop-color="#574ac3"/></linearGradient><linearGradient id="future" x2="1" y2="1"><stop stop-color="#52d5e5"/><stop offset="1" stop-color="#267f9f"/></linearGradient><style>.h{font:700 19px Inter,Arial,sans-serif;fill:#f4f6ff}.sub{font:500 14px Inter,Arial,sans-serif;fill:#acb8d4}.tag{font:700 12px Inter,Arial,sans-serif;letter-spacing:1.3px;fill:#d5ddf3}.card{fill:#18213a;stroke:#405078;stroke-width:1.4}</style></defs>
<rect width="1500" height="550" rx="28" fill="url(#bg)"/><text x="70" y="70" class="tag">PRODUCT EVOLUTION</text><text x="70" y="112" class="h" font-size="31">Build the shared layer only when it removes real duplication.</text><path d="M180 270H1320" stroke="#566a91" stroke-width="5" stroke-linecap="round"/>
<circle cx="180" cy="270" r="15" fill="#a89cff"/><rect x="70" y="160" width="220" height="220" rx="20" class="card"/><rect x="70" y="160" width="220" height="6" rx="3" fill="url(#done)"/><text x="95" y="205" class="tag">PHASE 0 · DONE</text><text x="95" y="250" class="h">Cursor stable</text><text x="95" y="290" class="sub">V1.1.2 verified</text><text x="95" y="318" class="sub">Native picker</text><text x="95" y="346" class="sub">Session + recovery</text>
<circle cx="465" cy="270" r="15" fill="#6bd5e5"/><rect x="355" y="160" width="220" height="220" rx="20" class="card"/><rect x="355" y="160" width="220" height="6" rx="3" fill="url(#future)"/><text x="380" y="205" class="tag">PHASE 1</text><text x="380" y="250" class="h">Extract Core</text><text x="380" y="290" class="sub">Runtime contracts</text><text x="380" y="318" class="sub">Sessions &amp; events</text><text x="380" y="346" class="sub">Permissions &amp; context</text>
<circle cx="750" cy="270" r="15" fill="#6bd5e5"/><rect x="640" y="160" width="220" height="220" rx="20" class="card"/><rect x="640" y="160" width="220" height="6" rx="3" fill="url(#future)"/><text x="665" y="205" class="tag">PHASE 2</text><text x="665" y="250" class="h">ACP setup</text><text x="665" y="290" class="sub">Detect clients</text><text x="665" y="318" class="sub">Generate config</text><text x="665" y="346" class="sub">Validate capabilities</text>
<circle cx="1035" cy="270" r="15" fill="#6bd5e5"/><rect x="925" y="160" width="220" height="220" rx="20" class="card"/><rect x="925" y="160" width="220" height="6" rx="3" fill="url(#future)"/><text x="950" y="205" class="tag">PHASE 3</text><text x="950" y="250" class="h">Native adapters</text><text x="950" y="290" class="sub">Host API audit</text><text x="950" y="318" class="sub">Per-host integration</text><text x="950" y="346" class="sub">Capability tests</text>
<circle cx="1320" cy="270" r="15" fill="#6bd5e5"/><rect x="1210" y="160" width="220" height="220" rx="20" class="card"/><rect x="1210" y="160" width="220" height="6" rx="3" fill="url(#future)"/><text x="1235" y="205" class="tag">PHASE 4–5</text><text x="1235" y="250" class="h">Ecosystem</text><text x="1235" y="290" class="sub">Adapter SDK</text><text x="1235" y="318" class="sub">Cross-platform</text><text x="1235" y="346" class="sub">Remote runtime</text>
<text x="70" y="455" class="sub">Each phase is gated by real client capability and regression evidence — not by a target number of integrations.</text></svg>
