<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="t d">
<title id="t">Target Antigravity Agent Bridge multi-harness architecture</title><desc id="d">ACP-native clients connect directly to the official Antigravity ACP server. Non-ACP clients use host adapters connected through a planned Bridge Core.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1020"/><stop offset="1" stop-color="#151d35"/></linearGradient><linearGradient id="v" x2="1" y2="1"><stop stop-color="#9589ff"/><stop offset="1" stop-color="#5d4dc9"/></linearGradient><linearGradient id="c" x2="1" y2="1"><stop stop-color="#54d7e8"/><stop offset="1" stop-color="#268eaf"/></linearGradient><linearGradient id="g" x2="1" y2="1"><stop stop-color="#f3ca7c"/><stop offset="1" stop-color="#bd843d"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="16"/></filter><marker id="a" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#91a5d4"/></marker><style>.title{font:700 34px Inter,Arial,sans-serif;fill:#f5f6ff}.h{font:700 22px Inter,Arial,sans-serif;fill:#f3f5ff}.sub{font:500 16px Inter,Arial,sans-serif;fill:#aeb9d5}.small{font:500 14px Inter,Arial,sans-serif;fill:#aeb9d5}.tag{font:700 12px Inter,Arial,sans-serif;letter-spacing:1.5px;fill:#cdd5ef}.box{fill:#17213a;stroke:#405078;stroke-width:1.5}.pill{fill:#202c49;stroke:#41547c;stroke-width:1}.direct{stroke:#e8c17a;stroke-width:3;stroke-dasharray:10 9;fill:none;marker-end:url(#a)}.bridge{stroke:#67d4e4;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1600" height="980" rx="30" fill="url(#bg)"/><circle cx="810" cy="530" r="340" fill="#5148c7" opacity=".12" filter="url(#glow)"/><circle cx="1300" cy="220" r="240" fill="#33c3dc" opacity=".08" filter="url(#glow)"/>
<text x="76" y="75" class="tag">TARGET ARCHITECTURE · PLANNED</text><text x="76" y="122" class="title">One upstream agent. Two integration paths.</text><text x="76" y="158" class="sub">Reuse ACP where it already works; add native adapters only where a host needs deeper integration.</text>
<rect x="590" y="205" width="420" height="150" rx="24" class="box"/><rect x="590" y="205" width="420" height="8" rx="4" fill="url(#g)"/><text x="630" y="250" class="tag">UPSTREAM AGENT</text><text x="630" y="290" class="h">Google Antigravity CLI</text><text x="630" y="322" class="sub">agy acp · auth · models · sessions · tools · permissions</text>
<rect x="70" y="205" width="410" height="150" rx="24" class="box"/><rect x="70" y="205" width="410" height="8" rx="4" fill="url(#g)"/><text x="108" y="250" class="tag">PATH A · ACP-NATIVE</text><text x="108" y="290" class="h">ACP clients</text><text x="108" y="322" class="sub">Zed · JetBrains · Xcode · Android Studio</text><path d="M480 280H580" class="direct"/><text x="505" y="252" class="small">ACP v1</text>
<rect x="470" y="465" width="660" height="320" rx="28" class="box"/><rect x="470" y="465" width="660" height="8" rx="4" fill="url(#c)"/><text x="515" y="515" class="tag">PATH B · NON-ACP / DEEP NATIVE INTEGRATION</text><text x="515" y="555" class="h">Antigravity Bridge Core</text><rect x="515" y="590" width="270" height="64" rx="14" class="pill"/><text x="540" y="629" class="sub">Runtime &amp; Model Registry</text><rect x="815" y="590" width="270" height="64" rx="14" class="pill"/><text x="840" y="629" class="sub">Session &amp; Context Broker</text><rect x="515" y="675" width="270" height="64" rx="14" class="pill"/><text x="540" y="714" class="sub">Event Normalizer</text><rect x="815" y="675" width="270" height="64" rx="14" class="pill"/><text x="840" y="714" class="sub">Permission &amp; Lifecycle</text><path d="M800 355V455" class="bridge"/><text x="825" y="420" class="small">ACP client</text>
<rect x="1190" y="465" width="340" height="320" rx="24" class="box"/><rect x="1190" y="465" width="340" height="8" rx="4" fill="url(#v)"/><text x="1230" y="515" class="tag">HOST ADAPTERS</text><rect x="1230" y="555" width="260" height="62" rx="14" class="pill"/><text x="1260" y="594" class="h">Cursor</text><text x="1390" y="594" class="small">FIRST</text><rect x="1230" y="635" width="260" height="52" rx="14" class="pill"/><text x="1260" y="668" class="sub">Native Agent / Provider APIs</text><rect x="1230" y="705" width="260" height="52" rx="14" class="pill"/><text x="1260" y="738" class="sub">Future host adapters</text><path d="M1130 625H1180" class="bridge"/>
<rect x="70" y="840" width="1460" height="88" rx="18" fill="#121a2e" stroke="#354466"/><text x="105" y="877" class="tag">KEY RULE</text><text x="245" y="877" class="sub">ACP clients connect directly when possible. Bridge Core is for shared management and hosts that need a native adapter.</text><text x="245" y="905" class="small">The target core and future adapters are planned work — only the Cursor path is shipped and verified today.</text></svg>
